name: Bug report
description: Something in the app isn't working
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: dropdown
    id: screen
    attributes:
      label: Where in the app?
      options: [Feed, Article, Quiz, You, Reminders, Other]
    validations:
      required: true
  - type: input
    id: phone
    attributes:
      label: Phone and Android version
      placeholder: e.g. Motorola Edge 60 Fusion, Android 17
  - type: input
    id: version
    attributes:
      label: App version
      placeholder: e.g. 1.0
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: Drag images here if they help. Please crop out anything personal.
